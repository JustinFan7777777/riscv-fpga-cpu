<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISC-V RV32I Single-Cycle Datapath</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            
            /* Stage Colors */
            --c-if: #3b82f6; /* Blue */
            --c-id: #8b5cf6; /* Purple */
            --c-ex: #f97316; /* Orange */
            --c-mem: #eab308; /* Yellow */
            --c-wb: #22c55e; /* Green */

            /* Control Signal Colors */
            --c-regwrite: #d946ef; /* Magenta */
            --c-alusrc: #06b6d4;   /* Cyan */
            --c-memtoreg: #a855f7; /* Purple */
            --c-memwrite: #ef4444; /* Red */
            --c-memread: #22c55e;  /* Green */
            --c-branch: #3b82f6;   /* Blue */
            --c-aluop: #f97316;    /* Orange */

            --inactive-stroke: #334155;
            --inactive-fill: #1e293b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Layout */
        .sidebar {
            width: 320px;
            background-color: var(--panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            z-index: 10;
        }

        h1 { font-size: 18px; margin: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        select {
            width: 100%;
            padding: 8px;
            background: var(--bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            cursor: pointer;
        }

        /* Stage Indicators */
        .stage-indicators {
            display: flex;
            justify-content: space-between;
            background: var(--bg);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .stage-dot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: bold;
            color: var(--text-dim);
        }
        .dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--inactive-fill);
            border: 2px solid var(--inactive-stroke);
            transition: all 0.3s;
        }
        
        /* Control Signal Table */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            text-align: left;
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--text-dim); font-weight: normal; }
        .sig-val { font-family: monospace; font-weight: bold; }

        /* Description Box */
        .desc-box {
            background: var(--bg);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-main);
        }
        .inst-meta {
            font-family: monospace;
            color: var(--c-ex);
            margin-bottom: 8px;
            display: block;
        }

        /* Main Area & SVG */
        .main-area {
            flex: 1;
            position: relative;
            background-color: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1100px;
            max-height: 650px;
        }

        /* SVG Base Styles */
        .bg-col { fill-opacity: 0.04; }
        .stage-label { font-size: 14px; font-weight: bold; fill: var(--inactive-stroke); transition: fill 0.3s; }
        
        .comp {
            fill: var(--inactive-fill);
            stroke: var(--inactive-stroke);
            stroke-width: 2;
            transition: all 0.3s ease;
        }
        .comp-label {
            fill: var(--text-dim);
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            transition: fill 0.3s;
        }

        .path {
            fill: none;
            stroke: var(--inactive-stroke);
            stroke-width: 2;
            transition: stroke 0.3s;
        }
        .path.dashed { stroke-dasharray: 4 4; }

        /* Active State Animations */
        @keyframes dashFlow {
            to { stroke-dashoffset: -16; }
        }

        .path.active {
            stroke-dasharray: 8 4;
            animation: dashFlow 0.8s linear infinite;
        }
        .path.dashed.active {
            stroke-dasharray: 6 6;
            animation: dashFlow 0.8s linear infinite reverse;
        }

        .comp.active { stroke-width: 2; }
        .comp.active + .comp-label { fill: #fff; }

        /* Filter Glows applied via JS classes */
        .glow-if { filter: drop-shadow(0 0 6px var(--c-if)); stroke: var(--c-if); }
        .glow-id { filter: drop-shadow(0 0 6px var(--c-id)); stroke: var(--c-id); }
        .glow-ex { filter: drop-shadow(0 0 6px var(--c-ex)); stroke: var(--c-ex); }
        .glow-mem { filter: drop-shadow(0 0 6px var(--c-mem)); stroke: var(--c-mem); }
        .glow-wb { filter: drop-shadow(0 0 6px var(--c-wb)); stroke: var(--c-wb); }

        .stroke-if { stroke: var(--c-if) !important; }
        .stroke-id { stroke: var(--c-id) !important; }
        .stroke-ex { stroke: var(--c-ex) !important; }
        .stroke-mem { stroke: var(--c-mem) !important; }
        .stroke-wb { stroke: var(--c-wb) !important; }

        /* Control Signal Active Colors */
        .stroke-regwrite { stroke: var(--c-regwrite) !important; }
        .stroke-alusrc { stroke: var(--c-alusrc) !important; }
        .stroke-memtoreg { stroke: var(--c-memtoreg) !important; }
        .stroke-memwrite { stroke: var(--c-memwrite) !important; }
        .stroke-memread { stroke: var(--c-memread) !important; }
        .stroke-branch { stroke: var(--c-branch) !important; }
        .stroke-aluop { stroke: var(--c-aluop) !important; }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--panel);
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 11px;
            font-family: monospace;
            color: var(--text-dim);
            pointer-events: none;
        }
        .leg-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .leg-line { width: 20px; height: 2px; }
        .leg-dash { border-top: 2px dashed var(--text-dim); width: 20px; }
    </style>
</head>

    <script>
        const instData = {
            "ADD": {
                meta: "R-type | 0000000 rs2 rs1 000 rd 0110011",
                desc: "Reads rs1 & rs2 from Register File. ALU computes sum. Result written back to rd.",
                comps: ["pc", "imem", "pcadder", "control", "regfile", "aluctrl", "muxA", "muxB", "alu", "wbmux"],
                paths: {
                    if: ["p_pc_imem", "p_pc_adder", "p_adder_pcsrc", "p_pcsrc_pc"],
                    id: ["p_imem_reg1", "p_imem_reg2", "p_imem_ctrl"],
                    ex: ["p_reg_muxA", "p_reg_muxB", "p_muxA_alu", "p_muxB_alu"],
                    mem: ["p_alu_wbmux"],
                    wb: ["p_wbmux_reg"]
                },
                ctrl: {
                    active: ["c_regwrite", "c_alusrcA", "c_alusrcB", "c_aluop", "c_aluctrl_alu", "c_memtoreg"],
                    vals: { RegWrite: '1', ALUSrcA: '0 (rs1)', ALUSrcB: '0 (rs2)', MemtoReg: '0 (ALU)', MemWrite: '0', MemRead: '0', Branch: '0', ALUOp: 'ADD' }
                },
                stages: [1, 1, 1, 1, 1] // Conceptually mem stage is pass-through
            },
            "SUB": {
                meta: "R-type | 0100000 rs2 rs1 000 rd 0110011",
                desc: "Reads rs1 & rs2. ALU computes rs1 - rs2. Result written back to rd.",
                comps: ["pc", "imem", "pcadder", "control", "regfile", "aluctrl", "muxA", "muxB", "alu", "wbmux"],
                paths: {
                    if: ["p_pc_imem", "p_pc_adder", "p_adder_pcsrc", "p_pcsrc_pc"], id: ["p_imem_reg1", "p_imem_reg2", "p_imem_ctrl"],
                    ex: ["p_reg_muxA", "p_reg_muxB", "p_muxA_alu", "p_muxB_alu"], mem: ["p_alu_wbmux"], wb: ["p_wbmux_reg"]
                },
                ctrl: {
                    active: ["c_regwrite", "c_alusrcA", "c_alusrcB", "c_aluop", "c_aluctrl_alu", "c_memtoreg"],
                    vals: { RegWrite: '1', ALUSrcA: '0', ALUSrcB: '0', MemtoReg: '0', MemWrite: '0', MemRead: '0', Branch: '0', ALUOp: 'SUB' }
                },
                stages: [1, 1, 1, 1, 1]
            },
            "AND": {
                meta: "R-type | 0000000 rs2 rs1 111 rd 0110011",
                desc: "Reads rs1 & rs2. ALU computes bitwise AND. Result written back to rd.",
                comps: ["pc", "imem", "pcadder", "control", "regfile", "aluctrl", "muxA", "muxB", "alu", "wbmux"],
                paths: {
                    if: ["p_pc_imem", "p_pc_adder", "p_adder_pcsrc", "p_pcsrc_pc"], id: ["p_imem_reg1", "p_imem_reg2", "p_imem_ctrl"],
                    ex: ["p_reg_muxA", "p_reg_muxB", "p_muxA_alu", "p_muxB_alu"], mem: ["p_alu_wbmux"], wb: ["p_wbmux_reg"]
                },
                ctrl: {
                    active: ["c_regwrite", "c_alusrcA", "c_alusrcB", "c_aluop", "c_aluctrl_alu", "c_memtoreg"],
                    vals: { RegWrite: '1', ALUSrcA: '0', ALUSrcB: '0', MemtoReg: '0', MemWrite: '0', MemRead: '0', Branch: '0', ALUOp: 'AND' }
                },
                stages: [1, 1, 1, 1, 1]
            },
            "ADDI": {
                meta: "I-type | imm[11:0] rs1 000 rd 0010011",
                desc: "Reads rs1 and sign-extends Immediate. ALU adds them. ALUSrc MUX selects Imm instead of rs2.",
                comps: ["pc", "imem", "pcadder", "control", "regfile", "immgen", "aluctrl", "muxA", "muxB", "alu", "wbmux"],
                paths: {
                    if: ["p_pc_imem", "p_pc_adder", "p_adder_pcsrc", "p_pcsrc_pc"],
                    id: ["p_imem_reg1", "p_imem_imm", "p_imem_ctrl"],
                    ex: ["p_reg_muxA", "p_imm_muxB", "p_muxA_alu", "p_muxB_alu"],
                    mem: ["p_alu_wbmux"], wb: ["p_wbmux_reg"]
                },
                ctrl: {
                    active: ["c_regwrite", "c_alusrcA", "c_alusrcB", "c_aluop", "c_aluctrl_alu", "c_memtoreg"],
                    vals: { RegWrite: '1', ALUSrcA: '0', ALUSrcB: '1 (Imm)', MemtoReg: '0', MemWrite: '0', MemRead: '0', Branch: '0', ALUOp: 'ADD' }
                },
                stages: [1, 1, 1, 1, 1]
            },
            "ORI": {
                meta: "I-type | imm[11:0] rs1 110 rd 0010011",
                desc: "Reads rs1 and sign-extends Immediate. ALU bitwise ORs them.",
                comps: ["pc", "imem", "pcadder", "control", "regfile", "immgen", "aluctrl", "muxA", "muxB", "alu", "wbmux"],
                paths: {
                    if: ["p_pc_imem", "p_pc_adder", "p_adder_pcsrc", "p_pcsrc_pc"], id: ["p_imem_reg1", "p_imem_imm", "p_imem_ctrl"],
                    ex: ["p_reg_muxA", "p_imm_muxB", "p_muxA_alu", "p_muxB_alu"], mem: ["p_alu_wbmux"], wb: ["p_wbmux_reg"]
                },
                ctrl: {
                    active: ["c_regwrite", "c_alusrcA", "c_alusrcB", "c_aluop", "c_aluctrl_alu", "c_memtoreg"],
                    vals: { RegWrite: '1', ALUSrcA: '0', ALUSrcB: '1', MemtoReg: '0', MemWrite: '0', MemRead: '0', Branch: '0', ALUOp: 'OR' }
                },
                stages: [1, 1, 1, 1, 1]
            },
            "LW": {
                meta: "I-type (Load) | imm[11:0] rs1 010 rd 0000011",
                desc: "Calculates address (rs1 + Imm). Reads Data Memory at address. MemtoReg MUX routes Data Memory output to Register File.",
                comps: ["pc", "imem", "pcadder", "control", "regfile", "immgen", "aluctrl", "muxA", "muxB", "alu", "dmem", "wbmux"],
                paths: {
                    if: ["p_pc_imem", "p_pc_adder", "p_adder_pcsrc", "p_pcsrc_pc"],
                    id: ["p_imem_reg1", "p_imem_imm", "p_imem_ctrl"],
                    ex: ["p_reg_muxA", "p_imm_muxB", "p_muxA_alu", "p_muxB_alu"],
                    mem: ["p_alu_dmem", "p_dmem_wbmux"],
                    wb: ["p_wbmux_reg"]
                },
                ctrl: {
                    active: ["c_regwrite", "c_alusrcA", "c_alusrcB", "c_aluop", "c_aluctrl_alu", "c_memread", "c_memtoreg"],
                    vals: { RegWrite: '1', ALUSrcA: '0', ALUSrcB: '1', MemtoReg: '1 (Mem)', MemWrite: '0', MemRead: '1', Branch: '0', ALUOp: 'ADD' }
                },
                stages: [1, 1, 1, 1, 1]
            },
            "SW": {
                meta: "S-type | imm[11:5] rs2 rs1 010 imm[4:0] 0100011",
                desc: "Calculates address (rs1 + Imm). Writes rs2 data into Data Memory. Writeback stage is completely inactive.",
                comps: ["pc", "imem", "pcadder", "control", "regfile", "immgen", "aluctrl", "muxA", "muxB", "alu", "dmem"],
                paths: {
                    if: ["p_pc_imem", "p_pc_adder", "p_adder_pcsrc", "p_pcsrc_pc"],
                    id: ["p_imem_reg1", "p_imem_reg2", "p_imem_imm", "p_imem_ctrl"],
                    ex: ["p_reg_muxA", "p_imm_muxB", "p_muxA_alu", "p_muxB_alu", "p_reg_dmem"],
                    mem: ["p_alu_dmem"], wb: []
                },
                ctrl: {
                    active: ["c_alusrcA", "c_alusrcB", "c_aluop", "c_aluctrl_alu", "c_memwrite"],
                    vals: { RegWrite: '0', ALUSrcA: '0', ALUSrcB: '1', MemtoReg: 'X', MemWrite: '1', MemRead: '0', Branch: '0', ALUOp: 'ADD' }
                },
                stages: [1, 1, 1, 1, 0] // WB inactive
            },
            "BEQ": {
                meta: "B-type | imm[12|10:5] rs2 rs1 000 imm[4:1|11] 1100011",
                desc: "ALU subtracts rs1-rs2. If Zero, AND gate triggers PCSrc to MUX Branch Target (PC + shifted Imm). WB inactive.",
                comps: ["pc", "imem", "pcadder", "control", "regfile", "immgen", "aluctrl", "muxA", "muxB", "alu", "shift", "badder", "and", "pcsrc"],
                paths: {
                    if: ["p_pc_imem", "p_pc_adder", "p_pc_badder", "p_pcsrc_pc"],
                    id: ["p_imem_reg1", "p_imem_reg2", "p_imem_imm", "p_imem_ctrl"],
                    ex: ["p_reg_muxA", "p_reg_muxB", "p_muxA_alu", "p_muxB_alu", "p_imm_shift", "p_shift_badder"],
                    mem: ["p_badder_pcsrc"], wb: []
                },
                ctrl: {
                    active: ["c_alusrcA", "c_alusrcB", "c_aluop", "c_aluctrl_alu", "c_branch", "c_alu_zero", "c_and_pcsrc"],
                    vals: { RegWrite: '0', ALUSrcA: '0', ALUSrcB: '0', MemtoReg: 'X', MemWrite: '0', MemRead: '0', Branch: '1', ALUOp: 'SUB' }
                },
                stages: [1, 1, 1, 1, 0]
            },
            "LUI": {
                meta: "U-type | imm[31:12] rd 0110111",
                desc: "Loads upper 20 bits of Immediate into rd. ALUSrcA routes constant 0, ALUSrcB routes Imm.",
                comps: ["pc", "imem", "pcadder", "control", "regfile", "immgen", "aluctrl", "muxA", "muxB", "alu", "wbmux"],
                paths: {
                    if: ["p_pc_imem", "p_pc_adder", "p_adder_pcsrc", "p_pcsrc_pc"],
                    id: ["p_imem_imm", "p_imem_ctrl"],
                    ex: ["p_zero_muxA", "p_imm_muxB", "p_muxA_alu", "p_muxB_alu"],
                    mem: ["p_alu_wbmux"], wb: ["p_wbmux_reg"]
                },
                ctrl: {
                    active: ["c_regwrite", "c_alusrcA", "c_alusrcB", "c_aluop", "c_aluctrl_alu", "c_memtoreg"],
                    vals: { RegWrite: '1', ALUSrcA: 'X (0)', ALUSrcB: '1', MemtoReg: '0', MemWrite: '0', MemRead: '0', Branch: '0', ALUOp: 'ADD' }
                },
                stages: [1, 1, 1, 1, 1]
            },
            "AUIPC": {
                meta: "U-type | imm[31:12] rd 0010111",
                desc: "Adds upper 20 bits of Immediate to PC. Result to rd. ALUSrcA routes PC, ALUSrcB routes Imm.",
                comps: ["pc", "imem", "pcadder", "control", "regfile", "immgen", "aluctrl", "muxA", "muxB", "alu", "wbmux"],
                paths: {
                    if: ["p_pc_imem", "p_pc_adder", "p_adder_pcsrc", "p_pc_muxA", "p_pcsrc_pc"],
                    id: ["p_imem_imm", "p_imem_ctrl"],
                    ex: ["p_imm_muxB", "p_muxA_alu", "p_muxB_alu"],
                    mem: ["p_alu_wbmux"], wb: ["p_wbmux_reg"]
                },
                ctrl: {
                    active: ["c_regwrite", "c_alusrcA", "c_alusrcB", "c_aluop", "c_aluctrl_alu", "c_memtoreg"],
                    vals: { RegWrite: '1', ALUSrcA: '1 (PC)', ALUSrcB: '1', MemtoReg: '0', MemWrite: '0', MemRead: '0', Branch: '0', ALUOp: 'ADD' }
                },
                stages: [1, 1, 1, 1, 1]
            },
            "JAL": {
                meta: "J-type | imm[20|10:1|11|19:12] rd 1101111",
                desc: "Jumps to PC + Imm. Saves return address (PC+4) to rd. Main EX ALU bypassed.",
                comps: ["pc", "imem", "pcadder", "control", "regfile", "immgen", "shift", "badder", "pcsrc", "wbmux"],
                paths: {
                    if: ["p_pc_imem", "p_pc_adder", "p_pc_badder", "p_adder_wbmux", "p_pcsrc_pc"],
                    id: ["p_imem_imm", "p_imem_ctrl"],
                    ex: ["p_imm_shift", "p_shift_badder"],
                    mem: ["p_badder_pcsrc"], wb: ["p_wbmux_reg"]
                },
                ctrl: {
                    active: ["c_regwrite", "c_memtoreg", "c_branch"],
                    vals: { RegWrite: '1', ALUSrcA: 'X', ALUSrcB: 'X', MemtoReg: '2 (PC+4)', MemWrite: '0', MemRead: '0', Branch: '1 (Jump)', ALUOp: 'X' }
                },
                stages: [1, 1, 0, 1, 1] // EX technically used for badder, but prompt requires 'No EX stage' logically for main datapath
            },
            "JALR": {
                meta: "I-type (Jump) | imm[11:0] rs1 000 rd 1100111",
                desc: "Jumps to rs1 + Imm. Saves return address (PC+4) to rd. EX active for target calc.",
                comps: ["pc", "imem", "pcadder", "control", "regfile", "immgen", "aluctrl", "muxA", "muxB", "alu", "pcsrc", "wbmux"],
                paths: {
                    if: ["p_pc_imem", "p_pc_adder", "p_adder_wbmux", "p_pcsrc_pc"],
                    id: ["p_imem_reg1", "p_imem_imm", "p_imem_ctrl"],
                    ex: ["p_reg_muxA", "p_imm_muxB", "p_muxA_alu", "p_muxB_alu"],
                    mem: ["p_alu_pcsrc"], wb: ["p_wbmux_reg"]
                },
                ctrl: {
                    active: ["c_regwrite", "c_alusrcA", "c_alusrcB", "c_aluop", "c_aluctrl_alu", "c_memtoreg"],
                    vals: { RegWrite: '1', ALUSrcA: '0', ALUSrcB: '1', MemtoReg: '2 (PC+4)', MemWrite: '0', MemRead: '0', Branch: 'Jump', ALUOp: 'ADD' }
                },
                stages: [1, 1, 1, 1, 1]
            }
        };

        const sel = document.getElementById("inst-select");
        
        function clearAll() {
            document.querySelectorAll('.active').forEach(el => {
                el.classList.remove('active');
                el.className.baseVal = el.className.baseVal.replace(/glow-\w+|stroke-\w+/g, '').trim();
            });
        }

        function setMarker(pathEl, colorClass) {
            if(pathEl.classList.contains('dashed')) {
                // Dashed lines mapped specific colors
                const ctrlType = pathEl.id.replace('c_', '').split('_')[0]; 
                pathEl.setAttribute('marker-end', `url(#arrow-${ctrlType})`);
            } else {
                pathEl.setAttribute('marker-end', `url(#arrow-${colorClass})`);
            }
        }

        function resetMarkers() {
            document.querySelectorAll('.path').forEach(p => p.setAttribute('marker-end', 'url(#arrow-solid)'));
        }

        function updateDatapath() {
            clearAll();
            resetMarkers();

            const instName = sel.value;
            const data = instData[instName];

            // 1. Text Info
            document.getElementById("desc-meta").innerText = data.meta;
            document.getElementById("desc-text").innerText = data.desc;

            // 2. Control Signals
            for(let key in data.ctrl.vals) {
                document.getElementById("sig-" + key).innerText = data.ctrl.vals[key];
            }

            // 3. Stage Indicators & Labels
            const stages = ["IF", "ID", "EX", "MEM", "WB"];
            stages.forEach((stg, idx) => {
                const isActive = data.stages[idx];
                const dot = document.getElementById("dot-" + stg);
                const lbl = document.getElementById("lbl-" + stg);
                if(isActive) {
                    dot.style.background = `var(--c-${stg.toLowerCase()})`;
                    dot.style.borderColor = `var(--c-${stg.toLowerCase()})`;
                    lbl.style.fill = `var(--c-${stg.toLowerCase()})`;
                } else {
                    dot.style.background = "var(--inactive-fill)";
                    dot.style.borderColor = "var(--inactive-stroke)";
                    lbl.style.fill = "var(--inactive-stroke)";
                }
            });

            // 4. Activate Components
            data.comps.forEach(c => {
                const el = document.getElementById("comp-" + c);
                if(el) {
                    el.classList.add("active");
                    // Assign glow based on column
                    const cx = el.getBBox().x;
                    let stgClass = "glow-if";
                    if(cx > 250) stgClass = "glow-id";
                    if(cx > 450) stgClass = "glow-ex";
                    if(cx > 650) stgClass = "glow-mem";
                    if(cx > 850) stgClass = "glow-wb";
                    el.classList.add(stgClass);
                }
            });

            // 5. Activate Data Paths
            for(let stg in data.paths) {
                data.paths[stg].forEach(pid => {
                    const el = document.getElementById(pid);
                    if(el) {
                        el.classList.add("active", "stroke-" + stg);
                        setMarker(el, stg);
                    }
                });
            }

            // 6. Activate Control Paths
            data.ctrl.active.forEach(pid => {
                const el = document.getElementById(pid);
                if(el) {
                    let colorClass = pid.replace('c_', '').split('_')[0]; // e.g. regwrite
                    if(colorClass === 'aluctrl' || colorClass === 'alu') colorClass = 'aluop';
                    if(colorClass === 'and') colorClass = 'branch';
                    el.classList.add("active", "stroke-" + colorClass);
                    setMarker(el, colorClass);
                }
            });
        }

        sel.addEventListener("change", updateDatapath);
        
        // Init
        updateDatapath();

    </script>
</body>
</html>
