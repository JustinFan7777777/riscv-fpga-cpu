<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RISC-V RV32I — 单周期 CPU 数据通路可视化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;display:flex;height:100vh;overflow:hidden}

/* === 左侧面板 === */
#side{width:280px;min-width:280px;background:#161b22;padding:14px;overflow-y:auto;border-right:1px solid #21262d;display:flex;flex-direction:column;gap:10px}
#side h1{font-size:15px;color:#f0f6fc;border-bottom:1px solid #21262d;padding-bottom:8px}
#side h1 span{color:#58a6ff;font-size:10px;display:block;margin-top:2px}
#side label{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:1px}
#sel{width:100%;padding:7px 10px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;font-size:12px;cursor:pointer}
#sel:focus{outline:none;border-color:#58a6ff}

/* 阶段进度指示器 */
#stg-bar{display:flex;gap:3px;align-items:center}
#stg-bar .d{flex:1;height:3px;border-radius:2px;background:#21262d;transition:background .3s}
#stg-bar .lbl{font-size:7px;color:#484f58;text-align:center;width:30px;transition:color .3s}
#stg-bar .lbl.on{color:#58a6ff}

/* 信号表 */
#sig-tbl{width:100%;border-collapse:collapse;font-size:10px}
#sig-tbl th{text-align:left;padding:3px 5px;color:#8b949e;font-weight:500;border-bottom:1px solid #21262d}
#sig-tbl td{padding:3px 5px;font-family:monospace;font-size:10px;border-bottom:1px solid #161b22}
.s1{color:#3fb950;font-weight:700}.s0{color:#f85149}.sx{color:#484f58}

/* 描述 */
#info{background:#0d1117;border-radius:6px;padding:8px;font-size:10px;line-height:1.4}
#info .n{font-size:13px;color:#58a6ff;font-weight:700}
#info .t{display:inline-block;background:#1f6feb;color:#fff;padding:1px 5px;border-radius:8px;font-size:9px;margin-left:4px}
#info .e{font-family:monospace;color:#d2a8ff;margin-top:3px}
#info .f{color:#8b949e;margin-top:3px;max-height:80px;overflow-y:auto}

/* === 主区域 === */
#main{flex:1;display:flex;align-items:center;justify-content:center;background:#0d1117}
svg{width:100%;height:100%}

/* === SVG 样式 === */
.cr{fill:#161b22;stroke:#30363d;stroke-width:1.5;rx:6;transition:all .5s}
.cl{fill:#8b949e;font-size:11px;text-anchor:middle;font-family:monospace;font-weight:600;pointer-events:none;transition:fill .5s}
.cs{fill:#484f58;font-size:8px;text-anchor:middle;pointer-events:none;transition:fill .5s}
.cn{fill:none;stroke:#21262d;stroke-width:1.8;transition:all .4s}
.cn-bus{stroke-width:3;stroke:#21262d}

/* 高亮 per stage */
.cr.on-if{fill:#0d1b33;stroke:#58a6ff;stroke-width:3;filter:drop-shadow(0 0 10px rgba(88,166,255,0.45))}
.cr.on-id{fill:#1a0d33;stroke:#a371f7;stroke-width:3;filter:drop-shadow(0 0 10px rgba(163,113,247,0.45))}
.cr.on-ex{fill:#331d05;stroke:#f0883e;stroke-width:3;filter:drop-shadow(0 0 10px rgba(240,136,62,0.45))}
.cr.on-mem{fill:#1a1a05;stroke:#d4a72c;stroke-width:3;filter:drop-shadow(0 0 10px rgba(212,167,44,0.45))}
.cr.on-wb{fill:#051a10;stroke:#3fb950;stroke-width:3;filter:drop-shadow(0 0 10px rgba(63,185,80,0.45))}
.cl.on-if{fill:#58a6ff}.cl.on-id{fill:#a371f7}.cl.on-ex{fill:#f0883e}.cl.on-mem{fill:#d4a72c}.cl.on-wb{fill:#3fb950}
.cs.on-if{fill:#58a6ff88}.cs.on-id{fill:#a371f788}.cs.on-ex{fill:#f0883e88}.cs.on-mem{fill:#d4a72c88}.cs.on-wb{fill:#3fb95088}

.cn.on-if{stroke:#58a6ff;stroke-width:3.5;filter:drop-shadow(0 0 6px rgba(88,166,255,0.5))}
.cn.on-id{stroke:#a371f7;stroke-width:3.5;filter:drop-shadow(0 0 6px rgba(163,113,247,0.5))}
.cn.on-ex{stroke:#f0883e;stroke-width:3.5;filter:drop-shadow(0 0 6px rgba(240,136,62,0.5))}
.cn.on-mem{stroke:#d4a72c;stroke-width:3.5;filter:drop-shadow(0 0 6px rgba(212,167,44,0.5))}
.cn.on-wb{stroke:#3fb950;stroke-width:3.5;filter:drop-shadow(0 0 6px rgba(63,185,80,0.5))}

/* 动画 */
@keyframes flow{to{stroke-dashoffset:-20}}
.cn.flow{stroke-dasharray:10 6;animation:flow .7s linear infinite;stroke-linecap:round}

/* 阶段标题 */
.sl{fill:#30363d;font-size:10px;text-anchor:middle;font-weight:700;letter-spacing:0.5px;transition:fill .5s}
.sl.on{fill:#58a6ff}

/* 背景列 */
.bg-col{fill:#0d1117;opacity:0.4}</style>
</head>
<body>

<!-- ===== 侧栏 ===== -->
<div id="side">
<h1>RISC-V RV32I CPU<span>单周期数据通路可视化</span></h1>
<div><label>选择指令</label>
<select id="sel">
<optgroup label="R-type (寄存器运算)"><option value="ADD">ADD  rd=rs1+rs2</option><option value="SUB">SUB  rd=rs1−rs2</option><option value="AND">AND  rd=rs1&rs2</option></optgroup>
<optgroup label="I-type ALU (立即数)"><option value="ADDI">ADDI rd=rs1+imm</option><option value="ORI">ORI  rd=rs1|imm</option></optgroup>
<optgroup label="访存指令"><option value="LW">LW   rd=mem[rs1+imm]</option><option value="SW">SW   mem[rs1+imm]=rs2</option></optgroup>
<optgroup label="分支指令"><option value="BEQ">BEQ  if rs1==rs2: PC+=imm</option></optgroup>
<optgroup label="U-type"><option value="LUI">LUI  rd=imm&lt;&lt;12</option><option value="AUIPC">AUIPC rd=PC+imm&lt;&lt;12</option></optgroup>
<optgroup label="跳转指令"><option value="JAL">JAL  rd=PC+4; PC+=imm</option><option value="JALR">JALR rd=PC+4; PC=(rs1+imm)&~1</option></optgroup>
</select></div>

<div id="stg-bar">
<div class="d" id="d-if"></div><span class="lbl" id="lb-if">IF</span>
<div class="d" id="d-id"></div><span class="lbl" id="lb-id">ID</span>
<div class="d" id="d-ex"></div><span class="lbl" id="lb-ex">EX</span>
<div class="d" id="d-mem"></div><span class="lbl" id="lb-mem">MEM</span>
<div class="d" id="d-wb"></div><span class="lbl" id="lb-wb">WB</span>
</div>

<table id="sig-tbl">
<tr><th>信号</th><th>值</th><th>目标</th></tr>
<tr><td>RegWrite</td><td id="s-rw">—</td><td>RegFile WE</td></tr>
<tr><td>ALUSrc</td><td id="s-as">—</td><td>ALU Src MUX</td></tr>
<tr><td>MemtoReg</td><td id="s-mr">—</td><td>WD3 MUX</td></tr>
<tr><td>MemWrite</td><td id="s-mw">—</td><td>DataMem WE</td></tr>
<tr><td>MemRead</td><td id="s-mrd">—</td><td>DataMem RE</td></tr>
<tr><td>Branch</td><td id="s-br">—</td><td>AND gate</td></tr>
<tr><td>ALUOp</td><td id="s-ao">—</td><td>ALU Control</td></tr>
</table>

<div id="info"><div class="n" id="i-n"></div><div class="t" id="i-t"></div><div class="e" id="i-e"></div><div class="f" id="i-f"></div></div>
</div>

<!-- ===== SVG ===== -->
<div id="main">
<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ma" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#30363d"/></marker>
<marker id="ma-if" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#58a6ff"/></marker>
<marker id="ma-id" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#a371f7"/></marker>

<marker id="ma-mem" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#d4a72c"/></marker>
<marker id="ma-wb" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#3fb950"/></marker>
</defs>

<!-- ===== 5 列背景 ===== -->
<rect x="0" y="0" width="240" height="660" class="bg-col"/><text x="120" y="18" class="sl" id="sl-if">IF · Instruction Fetch</text>
<rect x="240" y="0" width="240" height="660" class="bg-col"/><text x="360" y="18" class="sl" id="sl-id">ID · Instruction Decode</text>
<rect x="480" y="0" width="240" height="660" class="bg-col"/><text x="600" y="18" class="sl" id="sl-ex">EX · Execute</text>
<rect x="720" y="0" width="240" height="660" class="bg-col"/><text x="840" y="18" class="sl" id="sl-mem">MEM · Memory Access</text>
<rect x="960" y="0" width="240" height="660" class="bg-col"/><text x="1080" y="18" class="sl" id="sl-wb">WB · Write Back</text>
<line x1="240" y1="22" x2="240" y2="645" stroke="#21262d" stroke-dasharray="4 6"/><line x1="480" y1="22" x2="480" y2="645" stroke="#21262d" stroke-dasharray="4 6"/><line x1="720" y1="22" x2="720" y2="645" stroke="#21262d" stroke-dasharray="4 6"/><line x1="960" y1="22" x2="960" y2="645" stroke="#21262d" stroke-dasharray="4 6"/>

<!-- ================================================================ -->
<!-- IF 列 (0–240) ：PC + Instruction Memory + PC+4 Adder            -->
<!-- ================================================================ -->

<!-- PC -->
<rect id="c-pc" x="55" y="50" width="130" height="50" class="cr"/>
<text x="120" y="70" class="cl" id="l-pc">PC</text>
<text x="120" y="84" class="cs">Program Counter (32-bit)</text>
<text x="120" y="96" class="cs">Reset: 0x00004000</text>

<!-- Instruction Memory -->
<rect id="c-imem" x="40" y="160" width="160" height="70" class="cr"/>
<text x="120" y="182" class="cl" id="l-imem">Instruction Memory</text>
<text x="120" y="196" class="cs">IMem · BRAM · 64KB</text>
<text x="120" y="210" class="cs">$readmemh("batch_test.hex")</text>
<text x="120" y="224" class="cs">Combinational Read</text>

<!-- PC+4 Adder -->
<rect id="c-add4" x="55" y="300" width="130" height="38" class="cr"/>
<text x="120" y="316" class="cl" id="l-add4">Add （ +4 ）</text>
<text x="120" y="330" class="cs">PC + 4</text>

<!-- PC → IMem (data path: vertical) -->
<path id="p-pc-imem" d="M120 100 L120 160" class="cn"/>

<!-- PC → Add4 (control path: vertical) -->
<path id="p-pc-add4" d="M120 100 L120 300" class="cn"/>

<!-- inst bus going down from IMem to ID column -->
<path id="p-imem-inst" d="M120 230 L120 370" class="cn cn-bus"/>

<!-- ================================================================ -->
<!-- ID 列 (240–480) ：Control Unit + RegFile + ImmGen                -->
<!-- ================================================================ -->

<!-- Control Unit -->
<rect id="c-ctrl" x="270" y="50" width="140" height="55" class="cr"/>
<text x="340" y="70" class="cl" id="l-ctrl">Control Unit</text>
<text x="340" y="84" class="cs">opcode[6:0] → 控制信号</text>
<text x="340" y="98" class="cs">RegWrite·ALUSrc·MemtoReg·MemWrite·Branch·Jump·JALRSrc·ALUOp</text>

<!-- ALU Control -->
<rect id="c-actl" x="420" y="50" width="80" height="38" class="cr"/>
<text x="460" y="66" class="cl" id="l-actl">ALU Control</text>
<text x="460" y="80" class="cs">funct3+funct7+ALUOp</text>

<!-- Register File -->
<rect id="c-rf" x="270" y="160" width="190" height="80" class="cr"/>
<text x="365" y="182" class="cl" id="l-rf">Register File</text>
<text x="365" y="198" class="cs">32 registers × 32-bit · x0 = 0 (hardwired)</text>
<text x="365" y="214" class="cs">Read Addr 1: inst[19:15]  →  Read Data 1 (rs1_val)</text>
<text x="365" y="230" class="cs">Read Addr 2: inst[24:20]  →  Read Data 2 (rs2_val)</text>

<!-- ImmGen -->
<rect id="c-imm" x="270" y="310" width="120" height="45" class="cr"/>
<text x="330" y="328" class="cl" id="l-imm">ImmGen</text>
<text x="330" y="342" class="cs">I / S / B / U / J → 32-bit</text>
<text x="330" y="354" class="cs">Sign-extend / Zero-fill</text>

<!-- inst bus branch to Control Unit -->
<path id="p-inst-ctrl" d="M240 370 L240 40 L270 40 L270 50" class="cn"/>
<!-- inst bus branch to RegFile -->
<path id="p-inst-rf" d="M240 370 L260 370 L260 200" class="cn"/>
<!-- inst bus branch to ImmGen -->
<path id="p-inst-imm" d="M240 370 L270 370 L270 332" class="cn"/>

<!-- ================================================================ -->
<!-- EX 列 (480–720) ：ALU + ALU Src MUX + Shift L1 + Branch Add     -->
<!-- ================================================================ -->

<!-- ALU Src MUX -->
<rect id="c-amux" x="510" y="160" width="100" height="38" class="cr"/>
<text x="560" y="176" class="cl" id="l-amux">ALUSrc MUX</text>
<text x="560" y="190" class="cs">0=rs2_val · 1=Imm</text>

<!-- ALU -->
<rect id="c-alu" x="510" y="270" width="140" height="65" class="cr"/>
<text x="580" y="294" class="cl" id="l-alu">ALU</text>
<text x="580" y="310" class="cs">10 operations: ADD SUB AND OR XOR</text>
<text x="580" y="324" class="cs">SLL SRL SRA SLT SLTU</text>

<!-- Shift Left 1 -->
<rect id="c-sh1" x="510" y="410" width="70" height="30" class="cr"/>
<text x="545" y="424" class="cl" id="l-sh1">Shift L 1</text>
<text x="545" y="436" class="cs">imm &lt;&lt; 1</text>

<!-- Branch Target Add -->
<rect id="c-badd" x="600" y="410" width="130" height="30" class="cr"/>
<text x="665" y="423" class="cl" id="l-badd">Add Sum（PC + off）</text>
<text x="665" y="436" class="cs">Branch Target Address</text>

<!-- rs1 → ALU A (through bus channel at x=470) -->
<path id="p-rd1-alu" d="M365 240 L365 390 L580 390 L580 270" class="cn"/>

<!-- rs2 → ALUSrc MUX input 0 -->
<path id="p-rd2-amux" d="M460 200 L510 200 L510 179" class="cn"/>

<!-- Imm → ALUSrc MUX input 1 (around components via right side) -->
<path id="p-imm-amux" d="M330 355 L330 390 L440 390 L440 179 L510 179" class="cn"/>

<!-- ALUSrc MUX → ALU B -->
<path id="p-amux-alu" d="M560 198 L560 235 L580 235 L580 270" class="cn"/>

<!-- PC → Branch Target Add (long path from IF column) -->
<path id="p-pc-badd" d="M120 50 L120 38 L730 38 L730 425" class="cn"/>

<!-- Imm → Shift L1 (branch) -->
<path id="p-imm-sh1" d="M390 332 L390 410 L510 410 L510 425" class="cn"/>

<!-- Shift L1 → Branch Add -->
<path id="p-sh1-badd" d="M580 425 L600 425" class="cn"/>

<!-- ================================================================ -->
<!-- MEM 列 (720–960) ：Data Memory + PCSrc MUX + AND gate            -->
<!-- ================================================================ -->

<!-- Data Memory -->
<rect id="c-dmem" x="750" y="155" width="180" height="85" class="cr"/>
<text x="840" y="180" class="cl" id="l-dmem">Data Memory</text>
<text x="840" y="196" class="cs">DMem · BRAM 64KB</text>
<text x="840" y="212" class="cs">Address: ALU Result</text>
<text x="840" y="228" class="cs">MMIO: 0xFFFF_0000 ~ 0xFFFF_0014</text>

<!-- AND gate -->
<rect id="c-and" x="755" y="290" width="30" height="26" class="cr" rx="0"/>
<text x="770" y="308" font-size="10" fill="#8b949e" font-weight="700" text-anchor="middle">&amp;&amp;</text>

<!-- PCSrc MUX -->
<rect id="c-pmux" x="755" y="380" width="120" height="40" class="cr"/>
<text x="815" y="396" class="cl" id="l-pmux">PCSrc MUX</text>
<text x="815" y="410" class="cs">0: PC+4 · 1: BrTgt</text>

<!-- ALU Result → DataMem address (around via bottom) -->
<path id="p-alu-dmem" d="M580 335 L580 450 L840 450 L840 240" class="cn"/>

<!-- rs2 → DataMem write data -->
<path id="p-rd2-dmem" d="M460 200 L460 445 L810 445 L810 240" class="cn"/>

<!-- Branch → AND (top input) -->
<path id="p-br-and" d="M340 105 L340 420 L770 420 L770 316" class="cn"/>

<!-- Zero (from ALU) → AND (bottom input) -->
<path id="p-zero-and" d="M650 300 L650 420 L785 420 L785 316" class="cn"/>

<!-- AND output → PCSrc select -->
<path id="p-and-pmux" d="M770 316 L770 350 L790 350 L790 380" class="cn"/>

<!-- Branch Target → PCSrc MUX input 1 -->
<path id="p-bt-pmux" d="M730 425 L730 370 L755 370 L755 400" class="cn"/>

<!-- PC+4 → PCSrc MUX input 0 (long path from IF column) -->
<path id="p-add4-pmux" d="M185 319 L185 410 L755 410 L755 390" class="cn"/>

<!-- PCSrc output → PC (feedback loop, outermost path) -->
<path id="p-pmux-pc" d="M875 400 L900 400 L900 40 L185 40 L185 50" class="cn"/>

<!-- ================================================================ -->
<!-- WB 列 (960–1200) ：MemtoReg MUX → RegFile write back            -->
<!-- ================================================================ -->

<!-- MemtoReg (WD3) MUX -->
<rect id="c-mrmux" x="990" y="200" width="110" height="45" class="cr"/>
<text x="1045" y="216" class="cl" id="l-mrmux">WD3 MUX</text>
<text x="1045" y="230" class="cs">MemtoReg</text>
<text x="1045" y="244" class="cs">0=ALUResult · 1=ReadData</text>

<!-- DMem read data → WD3 MUX input 1 -->
<path id="p-dmem-mr" d="M930 200 L990 200 L990 222" class="cn"/>

<!-- ALU result → WD3 MUX input 0 -->
<path id="p-alu-mrmux" d="M650 300 L650 480 L1045 480 L1045 245" class="cn"/>

<!-- WD3 MUX output → RegFile Write Data -->
<path id="p-mrmux-rf" d="M1100 222 L1140 222 L1140 355 L555 355 L555 240" class="cn"/>

<rect x="990" y="560" width="190" height="85" fill="#161b22" stroke="#21262d" stroke-width="1" rx="6"/>
<text x="1000" y="578" font-size="8" fill="#8b949e">图例</text>
<line x1="1000" y1="590" x2="1025" y2="590" stroke="#58a6ff" stroke-width="3"/><text x="1030" y="593" font-size="7" fill="#8b949e">IF · Fetch</text>
<line x1="1000" y1="604" x2="1025" y2="604" stroke="#a371f7" stroke-width="3"/><text x="1030" y="607" font-size="7" fill="#8b949e">ID · Decode</text>
<line x1="1000" y1="618" x2="1025" y2="618" stroke="#f0883e" stroke-width="3"/><text x="1030" y="621" font-size="7" fill="#8b949e">EX · Execute</text>
<line x1="1090" y1="590" x2="1115" y2="590" stroke="#d4a72c" stroke-width="3"/><text x="1120" y="593" font-size="7" fill="#8b949e">MEM · Memory</text>
<line x1="1090" y1="604" x2="1115" y2="604" stroke="#3fb950" stroke-width="3"/><text x="1120" y="607" font-size="7" fill="#8b949e">WB · Write Back</text>
<line x1="1090" y1="618" x2="1115" y2="618" stroke="#21262d" stroke-width="1.5"/><text x="1120" y="621" font-size="7" fill="#484f58">inactive</text>
<line x1="1000" y1="635" x2="1025" y2="635" stroke="#21262d" stroke-width="1.5" stroke-dasharray="3 2"/><text x="1030" y="638" font-size="7" fill="#8b949e">control signal</text>
</svg>

<script>
// ================================================================
// 组件 & 通路数据库
// ================================================================
const allC=['c-pc','c-imem','c-add4','c-ctrl','c-actl','c-rf','c-imm','c-alu','c-amux','c-sh1','c-badd','c-dmem','c-pmux','c-and','c-mrmux'];
const allP=['p-pc-imem','p-imem-inst','p-inst-ctrl','p-inst-rf','p-inst-imm','p-pc-add4','p-rd1-alu','p-rd2-amux','p-imm-amux','p-amux-alu','p-alu-dmem','p-alu-mrmux','p-mrmux-rf','p-dmem-mr','p-pc-badd','p-imm-sh1','p-sh1-badd','p-bt-pmux','p-add4-pmux','p-pmux-pc','p-br-and','p-zero-and','p-and-pmux','p-rd2-dmem'];
const stgs=['if','id','ex','mem','wb'];

// 按阶段分组 (用于 sequential 动画)
const stageComps={if:['c-pc','c-imem','c-add4'],id:['c-ctrl','c-actl','c-rf','c-imm'],ex:['c-alu','c-amux','c-sh1','c-badd'],mem:['c-dmem','c-pmux','c-and'],wb:['c-mrmux']};
const stagePaths={if:['p-pc-imem','p-imem-inst','p-pc-add4'],id:['p-inst-ctrl','p-inst-rf','p-inst-imm'],ex:['p-rd1-alu','p-rd2-amux','p-imm-amux','p-amux-alu','p-pc-badd','p-imm-sh1','p-sh1-badd'],mem:['p-alu-dmem','p-rd2-dmem','p-bt-pmux','p-add4-pmux','p-pmux-pc','p-br-and','p-zero-and','p-and-pmux'],wb:['p-alu-mrmux','p-dmem-mr','p-mrmux-rf']};

// 构建指令数据
function mk(n,ty,enc,flow,paths,comps,sigs,activeStgs){return{name:n,type:ty,enc,flow,paths,comps,signals:sigs,stages:activeStgs||['if','id','ex','mem','wb']}}
const bp=['p-pc-imem','p-imem-inst','p-inst-ctrl','p-inst-rf','p-inst-imm','p-pc-add4','p-add4-pmux','p-pmux-pc'];
const bc=['c-pc','c-imem','c-add4','c-ctrl','c-rf','c-pmux'];
const D={};

// R-type
const rp=[...bp,'p-rd1-alu','p-rd2-amux','p-amux-alu','p-alu-dmem','p-alu-mrmux','p-mrmux-rf'];
const rc=[...bc,'c-alu','c-amux','c-dmem','c-mrmux','c-actl'];
D.ADD=mk('ADD — rd = rs1 + rs2','R-type','opcode=0110011  funct3=000  funct7=0000000','PC→IMem→Control Unit 译码。RegFile 读 rs1,rs2。ALUSrc=0: rs2 进 ALU B。ALUControl=0000(ADD)。Result→WD3 MUX→RegFile rd。PC+4→PCSrc(0)→PC。',rp,rc,{RegWrite:1,ALUSrc:0,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'10'});
D.SUB=mk('SUB — rd = rs1 - rs2','R-type','opcode=0110011  funct3=000  funct7=0100000','同 ADD。funct7[5]=1→ALUControl=0001(SUB)。体现 funct7[5] 区分 ADD/SUB。',rp,rc,{RegWrite:1,ALUSrc:0,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'10'});
D.AND=mk('AND — rd = rs1 & rs2','R-type','opcode=0110011  funct3=111  funct7=0000000','同 ADD。funct3=111→ALUControl=0010(AND)。6种 R-type 共享数据通路。',rp,rc,{RegWrite:1,ALUSrc:0,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'10'});

// I-type ALU
const ip=[...bp,'p-rd1-alu','p-imm-amux','p-amux-alu','p-alu-dmem','p-alu-mrmux','p-mrmux-rf'];
const ic=[...bc,'c-imm','c-alu','c-amux','c-dmem','c-mrmux','c-actl'];
D.ADDI=mk('ADDI — rd = rs1 + imm','I-type ALU','opcode=0010011  funct3=000','关键: ALUSrc=1! ALUSrc MUX 选通 ImmGen 符号扩展的 12-bit 立即数→ALU B。与 R-type 的唯一差异。',ip,ic,{RegWrite:1,ALUSrc:1,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'11'});
D.ORI=mk('ORI — rd = rs1 | imm','I-type ALU','opcode=0010011  funct3=110','同 ADDI。funct3=110→ALUControl=0011(OR)。I-type 立即数统一符号扩展。',ip,ic,{RegWrite:1,ALUSrc:1,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'11'});

// LW
D.LW=mk('LW — rd = mem[rs1 + imm]','I-type Load','opcode=0000011  funct3=010','ALU 算地址(ALUSrc=1)。MemRead=1→DMem 读数据→WD3 MUX 选 ReadData(MemtoReg=1)→RegFile→rd。唯一 MemtoReg=1!',
  [...bp,'p-rd1-alu','p-imm-amux','p-amux-alu','p-alu-dmem','p-dmem-mr','p-mrmux-rf'],[...bc,'c-imm','c-alu','c-amux','c-dmem','c-mrmux','c-actl'],{RegWrite:1,ALUSrc:1,MemtoReg:1,MemWrite:0,MemRead:1,Branch:0,ALUOp:'00'});

// SW
D.SW=mk('SW — mem[rs1 + imm] = rs2','S-type','opcode=0100011  funct3=010','ALU 算地址。MemWrite=1→DMem 将 rs2 写入地址。RegWrite=0→不写寄存器! MemtoReg=don\'t care。',
  [...bp,'p-rd1-alu','p-imm-amux','p-amux-alu','p-alu-dmem','p-rd2-dmem'],[...bc,'c-imm','c-alu','c-amux','c-dmem','c-actl'],{RegWrite:0,ALUSrc:1,MemtoReg:'x',MemWrite:1,MemRead:0,Branch:0,ALUOp:'00'},['if','id','ex','mem','']);

// BEQ
D.BEQ=mk('BEQ — if rs1==rs2: PC+=imm','B-type','opcode=1100011  funct3=000','Branch=1→AND gate。ALU SUB(ALUOp=01)→Zero 进 AND。Zero=1→AND out=1→PCSrc 选 BranchTarget。RegWrite=0。',
  [...bp,'p-rd1-alu','p-rd2-amux','p-amux-alu','p-pc-badd','p-imm-sh1','p-sh1-badd','p-bt-pmux','p-br-and','p-zero-and','p-and-pmux'],[...bc,'c-alu','c-amux','c-sh1','c-badd','c-and'],{RegWrite:0,ALUSrc:0,MemtoReg:'x',MemWrite:0,MemRead:0,Branch:1,ALUOp:'01'},['if','id','ex','mem','']);

// LUI
D.LUI=mk('LUI — rd = imm << 12','U-type','opcode=0110111','CPUTop MUX: ALU A=0(非 rs1!)→ALU 算 0+imm。ImmGen: inst[31:12]→左移12位。唯一 ALU_A=0。',
  [...bp,'p-imm-amux','p-amux-alu','p-alu-dmem','p-alu-mrmux','p-mrmux-rf'],[...bc,'c-imm','c-alu','c-amux','c-dmem','c-mrmux','c-actl'],{RegWrite:1,ALUSrc:1,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'00'},['if','id','ex','','wb']);

// AUIPC
D.AUIPC=mk('AUIPC — rd = PC + (imm<<12)','U-type','opcode=0010111','CPUTop MUX: ALU A=PC(非 rs1!)→ALU 算 PC+imm。唯一 ALU_A=PC。',
  [...bp,'p-imm-amux','p-amux-alu','p-alu-dmem','p-alu-mrmux','p-mrmux-rf'],[...bc,'c-imm','c-alu','c-amux','c-dmem','c-mrmux','c-actl'],{RegWrite:1,ALUSrc:1,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'00'},['if','id','ex','','wb']);

// JAL
D.JAL=mk('JAL — rd = PC+4; PC += imm','J-type','opcode=1101111','两事同步:①PCSrc 选 JumpTarget(PC+J-imm)→PC 跳转。②WD3 选 PC+4→rd(链接地址)。无 EX 阶段!',
  [...bp,'p-pc-badd','p-imm-sh1','p-sh1-badd','p-bt-pmux','p-mrmux-rf'],[...bc,'c-imm','c-sh1','c-badd','c-mrmux'],{RegWrite:1,ALUSrc:'x',MemtoReg:1,MemWrite:0,MemRead:0,Branch:0,ALUOp:'x'},['if','id','','','wb']);

// JALR
D.JALR=mk('JALR — rd=PC+4; PC=(rs1+imm)&~1','I-type Jump','opcode=1100111  funct3=000','同 JAL 但分支目标来源: JALRTarget=(rs1+imm)&~1(LSB 清零)。ALU 算 rs1+imm。唯一*用寄存器值*计算跳转目标。',
  [...bp,'p-rd1-alu','p-imm-amux','p-amux-alu','p-bt-pmux','p-mrmux-rf'],[...bc,'c-imm','c-alu','c-amux','c-mrmux'],{RegWrite:1,ALUSrc:1,MemtoReg:1,MemWrite:0,MemRead:0,Branch:0,ALUOp:'00'},['if','id','ex','','wb']);

// ================================================================
// SEQUENTIAL ANIMATION ENGINE
// ================================================================
let timer=null;
const amap={if:'ma-if',id:'ma-id',ex:'ma-ex',mem:'ma-mem',wb:'ma-wb'};

function resetAll(){
  clearTimeout(timer);timer=null;
  allC.forEach(id=>{const e=document.getElementById(id);if(e)e.classList.remove('on-if','on-id','on-ex','on-mem','on-wb')});
  allP.forEach(id=>{const e=document.getElementById(id);if(e){e.classList.remove('on-if','on-id','on-ex','on-mem','on-wb','flow');e.setAttribute('marker-end','url(#ma)')}});
  document.querySelectorAll('.cl,.cs').forEach(e=>e.classList.remove('on-if','on-id','on-ex','on-mem','on-wb'));
  stgs.forEach(s=>{document.getElementById('sl-'+s).classList.remove('on');document.getElementById('d-'+s).style.background='#21262d';document.getElementById('lb-'+s).classList.remove('on')});
  ['rw','as','mr','mw','mrd','br','ao'].forEach(id=>{const e=document.getElementById('s-'+id);e.textContent='—';e.className='sx'});
}

function lightStage(stg,d){
  // light components
  (stageComps[stg]||[]).forEach(id=>{
   const c=document.getElementById(id);if(!c)return;
   if(!d.comps.includes(id))return; // only if active for this instruction
   c.classList.add('on-'+stg);
   const lbl=document.getElementById('l-'+id.slice(2));
   if(lbl) lbl.classList.add('on-'+stg);
  });
  // light paths
  (stagePaths[stg]||[]).forEach(id=>{
   const p=document.getElementById(id);if(!p)return;
   if(!d.paths.includes(id))return;
   p.classList.add('on-'+stg);
   if(amap[stg]) p.setAttribute('marker-end','url(#'+amap[stg]+')');
   // keep flow on previous stages, add flow on current
   if(d.stages.includes(stg)) p.classList.add('flow');
  });
  // light stage label
  document.getElementById('sl-'+stg).classList.add('on');
  const cols={if:'#58a6ff',id:'#a371f7',ex:'#f0883e',mem:'#d4a72c',wb:'#3fb950'};
  document.getElementById('d-'+stg).style.background=cols[stg];
  document.getElementById('lb-'+stg).classList.add('on');
}

function showSignals(d){
  function ss(id,v){
   const e=document.getElementById('s-'+id);if(!e)return;
   e.textContent=v;e.className=v===1?'s1':v===0?'s0':'sx';
  }
  const s=d.signals;
  ss('rw',s.RegWrite);ss('as',s.ALUSrc);ss('mr',s.MemtoReg);
  ss('mw',s.MemWrite);ss('mrd',s.MemRead);ss('br',s.Branch);ss('ao',s.ALUOp);
}

function hl(name){
 resetAll();
 const d=D[name];if(!d)return;
 // show info immediately
 document.getElementById('i-n').textContent=d.name;
 document.getElementById('i-t').textContent=d.type;
 document.getElementById('i-e').textContent=d.enc;
 document.getElementById('i-f').textContent=d.flow;
 showSignals(d);

 // Sequential animation: light each active stage with delay
 const activeStgs=d.stages.filter(Boolean);
 let totalDelay=0;
 activeStgs.forEach((stg,i)=>{
  timer=setTimeout(()=>lightStage(stg,d),totalDelay);
  totalDelay+=600; // 600ms per stage
 });
 // Loop: after all stages lit + pause, restart
 timer=setTimeout(()=>{
  timer=setTimeout(()=>hl(name),800); // pause then restart
 },totalDelay+800);
}

document.getElementById('sel').addEventListener('change',function(){hl(this.value)});
hl('ADD');
</script>
