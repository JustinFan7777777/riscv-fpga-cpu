<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RISC-V RV32I — 单周期 CPU 数据通路可视化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;display:flex;height:100vh;overflow:hidden}

/* === 左侧面板 === */
#side{width:300px;min-width:300px;background:#161b22;padding:16px;overflow-y:auto;border-right:1px solid #21262d;display:flex;flex-direction:column;gap:12px}
#side h1{font-size:16px;color:#f0f6fc;border-bottom:1px solid #21262d;padding-bottom:10px}
#side h1 span{color:#58a6ff;font-size:11px;display:block;margin-top:2px}
#side label{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:1px}
#inst-select{width:100%;padding:7px 10px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;font-size:12px;cursor:pointer}
#inst-select:focus{outline:none;border-color:#58a6ff}

/* 阶段条 */
#stages{display:flex;gap:3px}.stg-dot{flex:1;height:3px;border-radius:2px;background:#21262d;transition:background .5s}

/* 信号表 */
#sig-tbl{width:100%;border-collapse:collapse;font-size:11px}
#sig-tbl th{text-align:left;padding:3px 6px;color:#8b949e;font-weight:500;border-bottom:1px solid #21262d}
#sig-tbl td{padding:3px 6px;font-family:monospace;font-size:11px;border-bottom:1px solid #161b22}
.s1{color:#3fb950;font-weight:700}.s0{color:#f85149}.sx{color:#484f58}

/* 指令信息 */
#info{background:#0d1117;border-radius:6px;padding:10px;font-size:11px;line-height:1.5}
#info .n{font-size:14px;color:#58a6ff;font-weight:700}
#info .t{display:inline-block;background:#1f6feb;color:#fff;padding:1px 6px;border-radius:8px;font-size:10px;margin-left:5px}
#info .e{font-family:monospace;color:#d2a8ff;margin-top:4px}
#info .f{color:#8b949e;margin-top:4px}

/* === 主区域 === */
#main{flex:1;display:flex;align-items:center;justify-content:center;background:#0d1117}
svg{width:100%;height:100%}

/* === SVG 样式 === */
.cr{fill:#161b22;stroke:#30363d;stroke-width:1;rx:4;transition:all .4s}
.cl{fill:#8b949e;font-size:9px;text-anchor:middle;font-family:monospace;pointer-events:none;transition:fill .4s}
.cs{fill:#484f58;font-size:7px;text-anchor:middle;pointer-events:none;transition:fill .4s}
.cn{fill:none;stroke:#21262d;stroke-width:1.5;transition:all .5s}
.cn-bus{stroke-width:3}
.col-h{fill:#161b22;stroke:#30363d;stroke-width:0.8;opacity:0.6}

/* 高亮 by stage */
.cr.on-if{fill:#0d1b33;stroke:#58a6ff;stroke-width:2.5;filter:drop-shadow(0 0 8px rgba(88,166,255,0.35))}
.cr.on-id{fill:#1a0d33;stroke:#a371f7;stroke-width:2.5;filter:drop-shadow(0 0 8px rgba(163,113,247,0.35))}
.cr.on-ex{fill:#331d05;stroke:#f0883e;stroke-width:2.5;filter:drop-shadow(0 0 8px rgba(240,136,62,0.35))}
.cr.on-mem{fill:#1a1a05;stroke:#d4a72c;stroke-width:2.5;filter:drop-shadow(0 0 8px rgba(212,167,44,0.35))}
.cr.on-wb{fill:#051a10;stroke:#3fb950;stroke-width:2.5;filter:drop-shadow(0 0 8px rgba(63,185,80,0.35))}
.cl.on-if{fill:#58a6ff}.cl.on-id{fill:#a371f7}.cl.on-ex{fill:#f0883e}.cl.on-mem{fill:#d4a72c}.cl.on-wb{fill:#3fb950}
.cs.on-if{fill:#58a6ff88}.cs.on-id{fill:#a371f788}.cs.on-ex{fill:#f0883e88}.cs.on-mem{fill:#d4a72c88}.cs.on-wb{fill:#3fb95088}

.cn.on-if{stroke:#58a6ff;stroke-width:3;filter:drop-shadow(0 0 5px rgba(88,166,255,0.4))}
.cn.on-id{stroke:#a371f7;stroke-width:3;filter:drop-shadow(0 0 5px rgba(163,113,247,0.4))}
.cn.on-ex{stroke:#f0883e;stroke-width:3;filter:drop-shadow(0 0 5px rgba(240,136,62,0.4))}
.cn.on-mem{stroke:#d4a72c;stroke-width:3;filter:drop-shadow(0 0 5px rgba(212,167,44,0.4))}
.cn.on-wb{stroke:#3fb950;stroke-width:3;filter:drop-shadow(0 0 5px rgba(63,185,80,0.4))}

/* 动画 */
@keyframes flow{to{stroke-dashoffset:-24}}
.cn.flow{stroke-dasharray:12 8;animation:flow .8s linear infinite;stroke-linecap:round}

/* 阶段标签 */
.sl{fill:#30363d;font-size:10px;text-anchor:middle;font-weight:600;letter-spacing:0.5px;transition:fill .5s}
.sl.on{fill:#58a6ff}

/* 图例 */
.lgd{fill:#161b22;stroke:#21262d;stroke-width:1;rx:6}
</style>
</head>
<body>

<div id="side">
<h1>RISC-V RV32I 数据通路<span>单周期 · Single-Cycle · Harvard Architecture</span></h1>
<div>
<label>选择指令</label>
<select id="sel">
<optgroup label="R-type"><option value="ADD">ADD  rd=rs1+rs2</option><option value="SUB">SUB  rd=rs1−rs2</option><option value="AND">AND  rd=rs1&rs2</option></optgroup>
<optgroup label="I-type ALU"><option value="ADDI">ADDI rd=rs1+imm</option><option value="ORI">ORI  rd=rs1|imm</option></optgroup>
<optgroup label="访存"><option value="LW">LW   rd=mem[rs1+imm]</option><option value="SW">SW   mem[rs1+imm]=rs2</option></optgroup>
<optgroup label="分支"><option value="BEQ">BEQ  if rs1==rs2: PC+=imm</option></optgroup>
<optgroup label="U-type"><option value="LUI">LUI  rd=imm&lt;&lt;12</option><option value="AUIPC">AUIPC rd=PC+imm&lt;&lt;12</option></optgroup>
<optgroup label="跳转"><option value="JAL">JAL  rd=PC+4; PC+=imm</option><option value="JALR">JALR rd=PC+4; PC=(rs1+imm)&~1</option></optgroup>
</select></div>

<div id="stages"><div class="stg-dot" id="d-if"></div><div class="stg-dot" id="d-id"></div><div class="stg-dot" id="d-ex"></div><div class="stg-dot" id="d-mem"></div><div class="stg-dot" id="d-wb"></div></div>

<table id="sig-tbl">
<tr><th>信号</th><th>值</th><th>目标</th></tr>
<tr><td>RegWrite</td><td id="s-rw">—</td><td>RegFile WE</td></tr>
<tr><td>ALUSrc</td><td id="s-as">—</td><td>ALU Src MUX</td></tr>
<tr><td>MemtoReg</td><td id="s-mr">—</td><td>WD3 MUX</td></tr>
<tr><td>MemWrite</td><td id="s-mw">—</td><td>DataMem WE</td></tr>
<tr><td>MemRead</td><td id="s-mrd">—</td><td>DataMem RE</td></tr>
<tr><td>Branch</td><td id="s-br">—</td><td>AND gate</td></tr>
<tr><td>ALUOp</td><td id="s-ao">—</td><td>ALU Control</td></tr>
</table>

<div id="info"><div class="n" id="i-n"></div><div class="t" id="i-t"></div><div class="e" id="i-e"></div><div class="f" id="i-f"></div></div>
</div>

<!-- ===== SVG ===== -->
<div id="main">
<svg viewBox="0 0 1050 600" xmlns="http://www.w3.org/2000/svg">

<marker id="ma" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#30363d"/></marker>

<line x1="210" y1="20" x2="210" y2="590" stroke="#21262d" stroke-dasharray="3 5"/>
<line x1="420" y1="20" x2="420" y2="590" stroke="#21262d" stroke-dasharray="3 5"/>
<line x1="630" y1="20" x2="630" y2="590" stroke="#21262d" stroke-dasharray="3 5"/>
<line x1="840" y1="20" x2="840" y2="590" stroke="#21262d" stroke-dasharray="3 5"/>

<!-- ================================================================= -->
<!-- IF 列 (0–210) -->
<!-- ================================================================= -->

<!-- PC -->
<rect id="c-pc" x="55" y="40" width="100" height="40" class="cr"/>

<!-- PC+4 Adder -->
<rect id="c-add4" x="55" y="220" width="100" height="32" class="cr"/>
<text x="105" y="233" class="cl" id="l-add4">Add</text><text x="105" y="245" class="cs">PC + 4</text>

<!-- PC → Add4 -->

<rect id="c-actl" x="360" y="40" width="75" height="34" class="cr"/>
<text x="397" y="54" class="cl" id="l-actl">ALU Ctl</text><text x="397" y="68" class="cs">ALUOp+funct</text>

<text x="320" y="140" class="cl" id="l-rf">Register File</text><text x="320" y="154" class="cs">32 × 32-bit  x0=0 hardwired</text>
<text x="320" y="168" class="cs">Read1[19:15]  Read2[24:20]  Write[11:7]</text>
<text x="320" y="182" class="cs">RegWrite enables write port</text>

<!-- ImmGen -->
<rect id="c-imm" x="30" y="280" width="90" height="36" class="cr"/>
<text x="75" y="294" class="cl" id="l-imm">ImmGen</text><text x="75" y="307" class="cs">I/S/B/U/J→32</text>

<!-- inst bus → Control Unit -->
<path id="p-inst-ctrl" d="M210 280 L210 35 L240 35 L240 40" class="cn"/>

<!-- inst bus → RegFile -->
<path id="p-inst-rf" d="M210 280 L240 280 L240 155" class="cn"/>

<!-- inst bus → ImmGen (穿过IF列底部) -->
<path id="p-inst-imm" d="M105 280 L75 280" class="cn"/>

<!-- Control outputs (vertical control lines) -->
<path id="k-rw" d="M320 84 L320 120" class="cn"/>
<path id="k-as" d="M270 84 L270 370 L360 370" class="cn"/>
<path id="k-mr" d="M350 84 L350 370 L550 370" class="cn"/>
<path id="k-mw" d="M380 84 L380 360 L690 360 L690 250" class="cn"/>
<path id="k-mrd" d="M400 84 L400 355 L680 355 L680 250" class="cn"/>
<path id="k-br" d="M290 84 L290 365 L660 365 L660 190" class="cn"/>
<path id="k-ao" d="M397 74 L397 365 L510 365 L510 210" class="cn"/>

<!-- ================================================================= -->
<!-- EX 列 (420–630) -->
<!-- ================================================================= -->

<!-- ALU -->
<rect id="c-alu" x="470" y="210" width="120" height="44" class="cr"/>
<text x="530" y="228" class="cl" id="l-alu">ALU</text><text x="530" y="242" class="cs">A op B → Result · Zero</text>
<text x="530" y="254" class="cs">10 operations (RV32I)</text>

<!-- ALU Source MUX -->
<rect id="c-amux" x="455" y="120" width="80" height="28" class="cr"/>
<text x="495" y="132" class="cl" id="l-amux">ALUSrc</text><text x="495" y="143" class="cs">0=rs2  1=imm</text>

<!-- Shift Left 1 -->
<rect id="c-sh1" x="460" y="300" width="60" height="24" class="cr"/>
<text x="490" y="311" class="cl" id="l-sh1">Shift L1</text><text x="490" y="322" class="cs">imm&lt;&lt;1</text>

<!-- Branch Target Add -->
<rect id="c-badd" x="560" y="300" width="90" height="28" class="cr"/>
<text x="605" y="313" class="cl" id="l-badd">Add Sum</text><text x="605" y="325" class="cs">PC + offset</text>

<!-- rs1 → ALU A -->
<path id="p-rd1-alu" d="M280 155 L280 380 L530 380 L530 210" class="cn"/>

<!-- rs2 → ALUSrc MUX input 0 -->
<path id="p-rd2-amux" d="M360 155 L360 134 L455 134" class="cn"/>

<!-- Imm → ALUSrc MUX input 1 -->
<path id="p-imm-amux" d="M75 316 L75 320 L360 320 L360 148 L455 148" class="cn"/>

<!-- ALUSrc MUX → ALU B -->
<path id="p-amux-alu" d="M495 148 L495 178 L530 178 L530 210" class="cn"/>

<!-- PC → Branch Target Add -->
<path id="p-pc-badd" d="M105 40 L105 30 L620 30 L620 300" class="cn"/>

<!-- Imm → Shift Left 1 (branch) -->

<!-- ShiftL1 → Branch Add -->
<path id="p-sh1-badd" d="M520 312 L560 312" class="cn"/>

<!-- ================================================================= -->
<!-- MEM 列 (630–840) -->
<!-- ================================================================= -->

<!-- Data Memory -->
<rect id="c-dmem" x="660" y="240" width="150" height="60" class="cr"/>
<text x="735" y="260" class="cl" id="l-dmem">Data Memory</text><text x="735" y="274" class="cs">Address: ALU result</text>
<text x="735" y="288" class="cs">BRAM 64KB + MMIO</text>

<!-- PCSrc MUX -->
<rect id="c-pmux" x="660" y="110" width="80" height="28" class="cr"/>
<text x="700" y="122" class="cl" id="l-pmux">PCSrc</text><text x="700" y="133" class="cs">0:+4 1:BrTgt</text>

<rect id="c-and" x="660" y="180" width="24" height="20" class="cr" rx="0"/>
<text x="672" y="194" font-size="8" fill="#8b949e" text-anchor="middle">&amp;</text>

<!-- Branch Target → PCSrc MUX input 1 -->
<path id="p-bt-pmux" d="M650 314 L650 90 L660 90 L660 110" class="cn"/>

<path id="p-alu-dmem" d="M530 254 L530 330 L735 330 L735 240" class="cn"/>

<path id="p-br-and" d="M290 365 L672 365 L672 200" class="cn"/>

<!-- AND → PCSrc control -->
<path id="p-and-pmux" d="M672 180 L672 150 L700 150 L700 138" class="cn"/>

<!-- PC+4 → PCSrc input 0 -->
<path id="p-add4-pmux" d="M155 236 L155 60 L630 60 L630 110 L660 110 L660 124" class="cn"/>

<!-- ================================================================= -->

<text x="920" y="132" class="cl" id="l-mrmux">MemtoReg</text><text x="920" y="143" class="cs">0=ALU 1=Mem</text>

<rect x="860" y="530" width="175" height="60" class="lgd"/>
<text x="870" y="546" font-size="7" fill="#8b949e">IF蓝 ID紫 EX橙 MEM黄 WB绿</text>

<line x1="870" y1="570" x2="890" y2="570" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 2"/><text x="895" y="573" font-size="6" fill="#8b949e">Control</text>

<script>
// ================================================================
// DATABASE
// ================================================================
const allC = ['c-pc','c-imem','c-add4','c-ctrl','c-actl','c-rf','c-imm','c-alu','c-amux','c-sh1','c-badd','c-dmem','c-pmux','c-and','c-mrmux'];
const allP = ['p-pc-imem','p-imem-inst','p-inst-ctrl','p-inst-rf','p-inst-imm','p-pc-add4','p-rd1-alu','p-rd2-amux','p-imm-amux','p-amux-alu','p-alu-dmem','p-alu-mrmux','p-mrmux-rf','p-dmem-mr','p-pc-badd','p-imm-sh1','p-sh1-badd','p-bt-pmux','p-add4-pmux','p-pmux-pc','p-br-and','p-zero-and','p-and-pmux','p-rd2-dmem'];
const allK = ['k-rw','k-as','k-mr','k-mw','k-mrd','k-br','k-ao'];
const stgs = ['if','id','ex','mem','wb'];
const stageComps = {
  if:['c-pc','c-imem','c-add4'], id:['c-ctrl','c-actl','c-rf','c-imm'],
  ex:['c-alu','c-amux','c-sh1','c-badd'], mem:['c-dmem','c-pmux','c-and'], wb:['c-mrmux']
};
const stagePaths = {
  if:['p-pc-imem','p-imem-inst','p-inst-imm','p-pc-add4','p-inst-ctrl','p-inst-rf'],
  id:['p-inst-rf','p-rd1-alu','p-rd2-amux','p-imm-amux'],
  ex:['p-amux-alu','p-pc-badd','p-imm-sh1','p-sh1-badd','p-rd1-alu','p-rd2-amux'],
  mem:['p-alu-dmem','p-rd2-dmem','p-bt-pmux','p-add4-pmux','p-pmux-pc','p-br-and','p-zero-and','p-and-pmux'],
  wb:['p-alu-mrmux','p-dmem-mr','p-mrmux-rf']
};

// 指令数据
function mk(n,ty,enc,flow,paths,comps,sigs,activeStgs){
  return {name:n,type:ty,enc,flow,paths,comps,signals:sigs,stages:activeStgs||['if','id','ex','mem','wb']};
}
const basePaths=['p-pc-imem','p-imem-inst','p-inst-ctrl','p-inst-rf','p-inst-imm','p-pc-add4','p-add4-pmux','p-pmux-pc'];
const baseComps=['c-pc','c-imem','c-add4','c-ctrl','c-rf','c-pmux'];
const D={};

// R-type
const rp=[...basePaths,'p-rd1-alu','p-rd2-amux','p-amux-alu','p-alu-dmem','p-alu-mrmux','p-mrmux-rf','k-rw','k-as','k-mrd','k-ao'];
const rc=[...baseComps,'c-alu','c-amux','c-dmem','c-mrmux','c-actl'];
D.ADD=mk('ADD — rd = rs1 + rs2','R-type','opcode=0110011  funct3=000  funct7=0000000','PC→IMem→Control Unit 译码→RegWrite=1,ALUSrc=0。RegFile 读 rs1,rs2→ALUSrc MUX 选 rs2→ALU 执行 ADD(ALUControl=0000)→Result 经 MemtoReg(选0) 写回 rd。PC+4→PCSrc(选0)→PC。',rp,rc,{RegWrite:1,ALUSrc:0,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'10(R)'});
D.SUB=mk('SUB — rd = rs1 − rs2','R-type','opcode=0110011  funct3=000  funct7=0100000','通路与 ADD 相同。唯一差异:funct7[5]=1→ALUControl=0001(SUB)。',rp,rc,{RegWrite:1,ALUSrc:0,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'10(R)'});
D.AND=mk('AND — rd = rs1 & rs2','R-type','opcode=0110011  funct3=111  funct7=0000000','通路与 ADD 相同。funct3=111→ALUControl=0010(AND)。',rp,rc,{RegWrite:1,ALUSrc:0,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'10(R)'});

// I-type ALU
const ip=[...basePaths,'p-rd1-alu','p-imm-amux','p-amux-alu','p-alu-dmem','p-alu-mrmux','p-mrmux-rf','k-rw','k-as','k-mrd','k-ao'];
const ic=[...baseComps,'c-imm','c-alu','c-amux','c-dmem','c-mrmux','c-actl'];
D.ADDI=mk('ADDI — rd = rs1 + imm','I-type ALU','opcode=0010011  funct3=000','关键:ALUSrc=1→ALUSrc MUX 选通 ImmGen 输出(符号扩展的 imm12)。ALU=ADD。',ip,ic,{RegWrite:1,ALUSrc:1,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'11(I)'});
D.ORI=mk('ORI — rd = rs1 | imm','I-type ALU','opcode=0010011  funct3=110','通路与 ADDI 相同。funct3=110→ALUControl=0011(OR)。',ip,ic,{RegWrite:1,ALUSrc:1,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'11(I)'});

// LW
D.LW=mk('LW — rd = mem[rs1+imm]','I-type Load','opcode=0000011  funct3=010','ALU 算地址 rs1+imm(ALUSrc=1,ALUOp=00→ADD)。ALUResult→DataMem Address。MemRead=1→Read data→MemtoReg MUX(选1)→RegFile Write data→RegWrite=1→写回 rd。唯一 MemtoReg=1 的指令。',
  [...basePaths,'p-rd1-alu','p-imm-amux','p-amux-alu','p-alu-dmem','p-dmem-mr','p-mrmux-rf','k-rw','k-as','k-mr','k-mrd','k-ao'],[...baseComps,'c-imm','c-alu','c-amux','c-dmem','c-mrmux','c-actl'],{RegWrite:1,ALUSrc:1,MemtoReg:1,MemWrite:0,MemRead:1,Branch:0,ALUOp:'00(ADD)'});

// SW
D.SW=mk('SW — mem[rs1+imm] = rs2','S-type','opcode=0100011  funct3=010','ALU 算地址 rs1+imm。MemWrite=1→DataMem 将 rs2 写入 ALUResult 地址。RegWrite=0→不写寄存器。唯一 MemWrite=1 的指令。',
  [...basePaths,'p-rd1-alu','p-imm-amux','p-amux-alu','p-alu-dmem','p-rd2-dmem','k-as','k-mw','k-ao'],[...baseComps,'c-imm','c-alu','c-amux','c-dmem','c-actl'],{RegWrite:0,ALUSrc:1,MemtoReg:'x',MemWrite:1,MemRead:0,Branch:0,ALUOp:'00(ADD)'},['if','id','ex','mem','']);

// BEQ
D.BEQ=mk('BEQ — if rs1==rs2: PC+=imm','B-type','opcode=1100011  funct3=000','Branch=1→AND gate。ALU 做 SUB(ALUOp=01),Zero 标志进 AND gate。Zero=1→AND out=1→PCSrc 选 BrTgt(PC+imm)。RegWrite=0。Branch 唯一激活 AND gate 的指令。',
  [...basePaths,'p-rd1-alu','p-rd2-amux','p-amux-alu','p-pc-badd','p-imm-sh1','p-sh1-badd','p-bt-pmux','p-br-and','p-zero-and','p-and-pmux','k-br','k-as','k-ao'],[...baseComps,'c-alu','c-amux','c-sh1','c-badd','c-and'],{RegWrite:0,ALUSrc:0,MemtoReg:'x',MemWrite:0,MemRead:0,Branch:1,ALUOp:'01(SUB)'},['if','id','ex','mem','']);

// LUI
D.LUI=mk('LUI — rd = imm << 12','U-type','opcode=0110111','CPUTop MUX:ALU A=0(非 rs1)→ALU 算 0+imm=imm。ALUSrc=1→ImmGen 输出。RegWrite=1→写回 rd。唯一 ALU_A=0 的指令。',
  [...basePaths,'p-imm-amux','p-amux-alu','p-alu-dmem','p-alu-mrmux','p-mrmux-rf','k-rw','k-as','k-mrd','k-ao'],[...baseComps,'c-imm','c-alu','c-amux','c-dmem','c-mrmux','c-actl'],{RegWrite:1,ALUSrc:1,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'00(ADD)'},['if','id','ex','','wb']);

// AUIPC
D.AUIPC=mk('AUIPC — rd = PC + (imm<<12)','U-type','opcode=0010111','与 LUI 差异:CPUTop MUX ALU A=PC→ALU 算 PC+imm。唯一 ALU_A=PC 的指令，实现 PC 相对寻址。',
  [...basePaths,'p-imm-amux','p-amux-alu','p-alu-dmem','p-alu-mrmux','p-mrmux-rf','k-rw','k-as','k-mrd','k-ao'],[...baseComps,'c-imm','c-alu','c-amux','c-dmem','c-mrmux','c-actl'],{RegWrite:1,ALUSrc:1,MemtoReg:0,MemWrite:0,MemRead:1,Branch:0,ALUOp:'00(ADD)'},['if','id','ex','','wb']);

  [...basePaths,'p-imm-sh1','p-sh1-badd','p-bt-pmux','p-mrmux-rf','k-rw','k-mr','p-pc-badd'],[...baseComps,'c-imm','c-sh1','c-badd','c-mrmux'],{RegWrite:1,ALUSrc:'x',MemtoReg:1,MemWrite:0,MemRead:0,Branch:0,ALUOp:'x'},['if','id','','','wb']);

D.JALR=mk('JALR — rd=PC+4; PC=(rs1+imm)&~1','I-type Jump','opcode=1100111  funct3=000','CPU 直接控制 PCSrc 选 JALRTarget=(rs1+imm)&~1(LSB清零)。ALU 算 rs1+imm。RegWrite=1→WD3 选 PC+4 写回 rd。唯一*用寄存器值*计算跳转目标的指令。',
  [...basePaths,'p-rd1-alu','p-imm-amux','p-amux-alu','p-bt-pmux','p-mrmux-rf','k-rw','k-as','k-mr','k-ao'],[...baseComps,'c-imm','c-alu','c-amux','c-mrmux'],{RegWrite:1,ALUSrc:1,MemtoReg:1,MemWrite:0,MemRead:0,Branch:0,ALUOp:'00(ADD)'},['if','id','ex','','wb']);

// ================================================================
// HIGHLIGHT ENGINE
// ================================================================
function hl(name){
 const d=D[name]; if(!d) return;

 // Reset ALL
 allC.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('on-if','on-id','on-ex','on-mem','on-wb')});
 allP.forEach(id=>{const el=document.getElementById(id);if(el){el.classList.remove('on-if','on-id','on-ex','on-mem','on-wb','flow');el.setAttribute('marker-end','url(#ma)')}});
 allK.forEach(id=>{const el=document.getElementById(id);if(el){el.classList.remove('on-if','on-id','on-ex','on-mem','on-wb','flow');el.setAttribute('marker-end','')}});
 document.querySelectorAll('.cl,.cs').forEach(el=>el.classList.remove('on-if','on-id','on-ex','on-mem','on-wb'));
 stgs.forEach(s=>{document.getElementById('sl-'+s).classList.remove('on');document.getElementById('d-'+s).style.background='#21262d'});

 // Build sets
 const pSet=new Set(d.paths);
 const cSet=new Set(d.comps);
 const activeStgs=new Set(d.stages.filter(Boolean));
 const amap={if:'ma-if',id:'ma-id',ex:'ma-ex',mem:'ma-mem',wb:'ma-wb'};

 // Highlight paths
 d.paths.forEach(id=>{
  const el=document.getElementById(id);
  if(!el) return;
  let sg;
  // All base paths run through IF/ID first
  for(const s of stgs){
   if(stagePaths[s]&&stagePaths[s].includes(id)){sg=s;break}
  }
  if(sg){
   el.classList.add('on-'+sg);
   if(amap[sg]) el.setAttribute('marker-end','url(#'+amap[sg]+')');
   // Animate if this stage is in active stages
   if(activeStgs.has(sg)) el.classList.add('flow');
  }
 });

 // Highlight components
 d.comps.forEach(id=>{
  const rect=document.getElementById(id);
  if(!rect) return;
  for(const s of stgs){
   if(stageComps[s]&&stageComps[s].includes(id)){
    rect.classList.add('on-'+s);
    const lbl=document.getElementById('l-'+id.slice(2));
    if(lbl) lbl.classList.add('on-'+s);
    break;
   }
  }
 });

 // Stage labels
 d.stages.forEach((s,i)=>{
  if(s){
   document.getElementById('sl-'+stgs[i]).classList.add('on');
   const col={if:'#58a6ff',id:'#a371f7',ex:'#f0883e',mem:'#d4a72c',wb:'#3fb950'}[stgs[i]];
   document.getElementById('d-'+stgs[i]).style.background=col;
  }
 });

 // Signals
 const sigs=d.signals;
 function ss(id,v){
  const el=document.getElementById('s-'+id);
  if(!el) return;
  el.textContent=v;
  el.className=v===1?'s1':v===0?'s0':'sx';
 }
 ss('rw',sigs.RegWrite);ss('as',sigs.ALUSrc);ss('mr',sigs.MemtoReg);
 ss('mw',sigs.MemWrite);ss('mrd',sigs.MemRead);ss('br',sigs.Branch);ss('ao',sigs.ALUOp);

 // Info
 document.getElementById('i-n').textContent=d.name;
 document.getElementById('i-t').textContent=d.type;
 document.getElementById('i-e').textContent=d.enc;
 document.getElementById('i-f').textContent=d.flow;
}

document.getElementById('sel').addEventListener('change',function(){hl(this.value)});
hl('ADD');
</script>
